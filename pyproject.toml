[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex"
version = "0.1.0"
description = "AI-assisted NSE cash-equity research and gated trading (Zerodha Kite Connect)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Tradex" }]
dependencies = [
    "alembic==1.14.1",
    "cryptography==44.0.1",
    "fastapi==0.115.8",
    "httpx==0.28.1",
    "numpy==2.2.3",
    "pandas==2.2.3",
    "psycopg[binary]==3.2.4",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.38",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "ruff==0.9.6",
    "types-python-dateutil==2.9.0.20241206",
]
kite = [
    "kiteconnect==5.0.1",
]
dashboard = [
    "streamlit==1.42.0",
]

[project.scripts]
tradex-api = "tradex.main:run"
tradex-ui = "tradex.dashboard.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradex"]

[tool.hatch.build.targets.sdist]
include = ["src/tradex", "tests", "alembic", "docs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tradex"]
mypy_path = "src"
